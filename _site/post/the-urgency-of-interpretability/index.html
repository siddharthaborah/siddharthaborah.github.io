  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('theme-toggle');
      const root = document.documentElement;
      
      // Set initial checkbox state
      if (root.getAttribute('data-theme') === 'dark') {
        toggle.checked = true;
      }

      toggle.addEventListener('change', (e) => {
        const newTheme = e.target.checked ? 'dark' : 'light';
        root.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      // TOC Logic
      const content = document.querySelector('.page-main .container');
      const tocToggle = document.getElementById('toc-toggle');
      const tocSidebar = document.getElementById('toc-sidebar');
      const tocOverlay = document.getElementById('toc-overlay');
      const tocClose = document.getElementById('toc-close');
      const tocNav = document.getElementById('toc-nav');

      if (content && tocNav) {
        const headings = content.querySelectorAll('h2, h3');
        if (headings.length > 0) {
          tocToggle.style.display = 'block'; // Show hamburger if there are headings
          const ul = document.createElement('ul');
          ul.className = 'toc-list';
          headings.forEach((heading, index) => {
            if (!heading.id) {
              heading.id = 'heading-' + index;
            }
            const li = document.createElement('li');
            li.className = 'toc-item toc-' + heading.tagName.toLowerCase();
            const a = document.createElement('a');
            a.href = '#' + heading.id;
            a.textContent = heading.textContent;
            li.appendChild(a);
            ul.appendChild(li);
          });
          tocNav.appendChild(ul);
        }
      }

      function openSidebar() {
        tocSidebar.classList.add('open');
        tocOverlay.classList.add('open');
        document.body.style.overflow = 'hidden'; // Prevent background scrolling
      }

      function closeSidebar() {
        tocSidebar.classList.remove('open');
        tocOverlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      if(tocToggle) tocToggle.addEventListener('click', openSidebar);
      if(tocClose) tocClose.addEventListener('click', closeSidebar);
      if(tocOverlay) tocOverlay.addEventListener('click', closeSidebar);
      
      // Close sidebar when clicking a link
      if(tocNav) {
        tocNav.addEventListener('click', (e) => {
          if(e.target.tagName.toLowerCase() === 'a') {
            closeSidebar();
          }
        });
      }
    });
  </script>
