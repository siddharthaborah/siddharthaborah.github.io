---
layout: default
---
<div class="post-header" style="margin-bottom: 2rem;">
  <a href="{{ '/' | relative_url }}" style="text-decoration: none; color: var(--secondary-text); font-size: 0.9rem;">&larr; Back to Home</a>
  <h1 style="margin-top: 1rem; margin-bottom: 0.2rem;">{{ page.title }}</h1>
  {% if page.date %}
  <div style="color: var(--secondary-text); font-size: 0.9rem;">{{ page.date | date: "%B %d, %Y" }}</div>
  {% endif %}
</div>

<div class="post-content">
  {{ content }}
</div>
