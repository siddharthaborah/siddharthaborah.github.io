<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ]
    });">
  </script>
  {% endif %}
  <script>
    // Set initial theme based on user preference or OS preference before page load to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="container">
        <a href="{{ '/' | relative_url }}" class="header-name-link">
          <h1 class="header-name">{{ site.title }}</h1>
        </a>
        <div class="toggle-container">
          <input type="checkbox" id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
          <label for="theme-toggle" class="theme-toggle-label"></label>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        {{ content }}
      </div>
    </main>

    <footer style="padding: 2rem 0; border-top: 1px solid var(--border-color); color: var(--secondary-text); font-size: 0.9rem; text-align: center; margin-top: auto;">
      <div class="container">
        &copy; {{ site.time | date: '%Y' }} Siddhartha Borah. <br>
        <a href="https://github.com/siddharthaborah" target="_blank" style="color: var(--secondary-text); text-decoration: none; margin: 0.5rem 0.5rem 0;">GitHub</a>
        &bull;
        <a href="https://linkedin.com/in/siddharthaborah" target="_blank" style="color: var(--secondary-text); text-decoration: none; margin: 0.5rem 0.5rem 0;">LinkedIn</a>
      </div>
    </footer>
  </div>



  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('theme-toggle');
      const root = document.documentElement;
      
      // Set initial checkbox state
      if (root.getAttribute('data-theme') === 'dark') {
        toggle.checked = true;
      }

      toggle.addEventListener('change', (e) => {
        const newTheme = e.target.checked ? 'dark' : 'light';
        root.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });

      // Add tooltips to footnote links
      const footnoteLinks = document.querySelectorAll('sup a.footnote, a.footnote');
      footnoteLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href.startsWith('#')) {
          const targetId = href.substring(1);
          const targetFootnote = document.getElementById(targetId);
          if (targetFootnote) {
            const clone = targetFootnote.cloneNode(true);
            const reverseLink = clone.querySelector('.reversefootnote');
            if (reverseLink) reverseLink.remove();
            link.setAttribute('title', clone.textContent.trim());
          }
        }
      });
    });
  </script>
</body>
</html>
